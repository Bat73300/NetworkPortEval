name: Signed and notarized macOS builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: notarized-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-notarize:
    name: ${{ matrix.arch }} · Developer ID + notarization
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Require distribution credentials
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in SIGNING_CERTIFICATE_P12_BASE64 SIGNING_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Developer ID certificate in temporary keychain
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/networkporteval-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PASSWORD_PATH="$RUNNER_TEMP/keychain-password"
          printf '%s' "$KEYCHAIN_PASSWORD" > "$KEYCHAIN_PASSWORD_PATH"
          chmod 600 "$KEYCHAIN_PASSWORD_PATH"
          printf '%s' "$SIGNING_CERTIFICATE_P12_BASE64" | python3 -c \
            'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' \
            > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "The imported certificate is not a valid Developer ID Application identity." >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD_PATH=$KEYCHAIN_PASSWORD_PATH" >> "$GITHUB_ENV"
          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"

      - name: Build with hardened runtime and Developer ID
        run: ./build-app.sh

      - name: Verify signature and hardened runtime
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 NetworkPortEval.app
          codesign --display --verbose=4 NetworkPortEval.app 2>&1 | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'flags=.*runtime' "$RUNNER_TEMP/signature.txt"

      - name: Submit app to Apple and staple notarization ticket
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          SUBMISSION_ZIP="$RUNNER_TEMP/NetworkPortEval-notarization.zip"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | python3 -c \
            'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' \
            > "$NOTARY_KEY"
          ditto -c -k --sequesterRsrc --keepParent NetworkPortEval.app "$SUBMISSION_ZIP"
          xcrun notarytool submit "$SUBMISSION_ZIP" \
            --key "$NOTARY_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait --output-format json > "$RUNNER_TEMP/notary-result.json"
          python3 - "$RUNNER_TEMP/notary-result.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if result.get("status") != "Accepted":
              raise SystemExit(f"Apple notarization was not accepted: {result.get('status', 'unknown')}")
          print(f"Apple notarization accepted (id: {result.get('id', 'unavailable')}).")
          PY
          xcrun stapler staple NetworkPortEval.app
          xcrun stapler validate NetworkPortEval.app
          spctl --assess --type execute --verbose=4 NetworkPortEval.app

      - name: Package and checksum notarized app
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent NetworkPortEval.app \
            "dist/NetworkPortEval-${{ matrix.arch }}.zip"
          shasum -a 256 "dist/NetworkPortEval-${{ matrix.arch }}.zip" \
            | tee "dist/NetworkPortEval-${{ matrix.arch }}.zip.sha256"

      - name: Upload notarized build
        uses: actions/upload-artifact@v6
        with:
          name: NetworkPortEval-notarized-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing materials
        if: always()
        run: |
          set +e
          security delete-keychain "$RUNNER_TEMP/networkporteval-signing.keychain-db"
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/keychain-password" \
            "$RUNNER_TEMP/AuthKey_"*.p8 "$RUNNER_TEMP/NetworkPortEval-notarization.zip"
