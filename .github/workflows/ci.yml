name: macOS build and validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: ${{ matrix.arch }} · macOS 26+
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Run focused validation suite
        run: ./validate.sh

      - name: Run Swift package tests
        run: |
          mkdir -p .build/SwiftPMModuleCache .build/ClangModuleCache .build/SwiftPackageScratch
          swift test --scratch-path .build/SwiftPackageScratch
        env:
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.build/SwiftPMModuleCache
          CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/ClangModuleCache

      - name: Build app bundle
        run: ./build-app.sh

      - name: Package architecture build and checksum
        run: |
          STAGE="$(mktemp -d)"
          cp -R NetworkPortEval.app "$STAGE/"
          xattr -cr "$STAGE/NetworkPortEval.app"
          codesign --verify --deep --strict "$STAGE/NetworkPortEval.app"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE/NetworkPortEval.app" "NetworkPortEval-${{ matrix.arch }}.zip"
          shasum -a 256 "NetworkPortEval-${{ matrix.arch }}.zip" | tee "NetworkPortEval-${{ matrix.arch }}.zip.sha256"

      - name: Upload development build artifact
        uses: actions/upload-artifact@v6
        with:
          name: NetworkPortEval-${{ matrix.arch }}
          path: |
            NetworkPortEval-${{ matrix.arch }}.zip
            NetworkPortEval-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
